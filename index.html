<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI邮件改写器</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-800">
    <main class="mx-auto flex min-h-screen w-full max-w-4xl flex-col px-6 py-12">
      <header class="mb-10 text-center">
        <h1 class="text-4xl font-bold tracking-tight text-slate-900 md:text-5xl">AI邮件改写器</h1>
        <p class="mt-3 text-base text-slate-600 md:text-lg">把生硬的话变成得体的职场表达</p>
      </header>

      <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm md:p-6">
        <label for="inputEmail" class="mb-3 block text-sm font-medium text-slate-700">原始邮件内容</label>
        <textarea
          id="inputEmail"
          rows="8"
          placeholder="粘贴你的原始邮件内容"
          class="w-full resize-y rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm leading-6 text-slate-800 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-100"
        ></textarea>

        <div class="mt-5 flex flex-wrap gap-3">
          <button
            id="formalBtn"
            class="inline-flex items-center justify-center rounded-xl bg-slate-900 px-5 py-2.5 text-sm font-medium text-white transition hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-300"
          >
            改正式
          </button>
          <button
            id="friendlyBtn"
            class="inline-flex items-center justify-center rounded-xl bg-blue-600 px-5 py-2.5 text-sm font-medium text-white transition hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
          >
            改友好
          </button>
        </div>
      </section>

      <section class="mt-6 flex-1 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm md:p-6">
        <div class="mb-3 text-sm font-medium text-slate-700">改写结果</div>
        <div
          id="output"
          class="min-h-[180px] whitespace-pre-wrap rounded-xl border border-dashed border-slate-300 bg-slate-50 px-4 py-3 text-sm leading-6 text-slate-700"
        >
点击“改正式”或“改友好”后，这里会显示改写结果。
        </div>
      </section>
    </main>

    <script>
      const inputEl = document.getElementById("inputEmail");
      const outputEl = document.getElementById("output");
      const formalBtn = document.getElementById("formalBtn");
      const friendlyBtn = document.getElementById("friendlyBtn");
      let isLoading = false;

      function normalizeInput(text) {
        return text.trim().replace(/\n{3,}/g, "\n\n");
      }

      function setLoadingState(loading, activeButton) {
        isLoading = loading;
        formalBtn.disabled = loading;
        friendlyBtn.disabled = loading;

        formalBtn.classList.toggle("opacity-60", loading);
        formalBtn.classList.toggle("cursor-not-allowed", loading);
        friendlyBtn.classList.toggle("opacity-60", loading);
        friendlyBtn.classList.toggle("cursor-not-allowed", loading);

        formalBtn.textContent = "改正式";
        friendlyBtn.textContent = "改友好";

        if (loading && activeButton) {
          activeButton.textContent = "改写中...";
        }
      }

      async function requestRewrite(content, tone) {
        const response = await fetch("/api/rewrite", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content, tone }),
        });

        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.error || "请求失败，请稍后重试。");
        }

        return result.rewritten;
      }

      async function handleRewrite(tone, button) {
        if (isLoading) {
          return;
        }

        const raw = normalizeInput(inputEl.value);
        if (!raw) {
          outputEl.textContent = "请先输入原始邮件内容，再进行改写。";
          return;
        }

        try {
          setLoadingState(true, button);
          outputEl.textContent = "正在调用智谱 AI 改写，请稍候...";
          const rewritten = await requestRewrite(raw, tone);
          outputEl.textContent = rewritten;
        } catch (error) {
          outputEl.textContent = `改写失败：${error.message}`;
        } finally {
          setLoadingState(false);
        }
      }

      formalBtn.addEventListener("click", () => handleRewrite("formal", formalBtn));
      friendlyBtn.addEventListener("click", () => handleRewrite("friendly", friendlyBtn));
    </script>
  </body>
</html>
